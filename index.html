:root{color-scheme:dark;--cyan:#37E6FF;--violet:#9B6BFF;--pink:#FF4FD8;--muted:#8796B3;--line:rgba(110,160,255,.25)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 600px at 50% 45%,rgba(40,70,200,.38),transparent 70%),linear-gradient(rgba(80,130,255,.05) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(80,130,255,.05) 1px,transparent 1px) 0 0/44px 44px,#03050B;color:#E9F1FF;font:15px/1.5 "Inter",system-ui,sans-serif;display:grid;place-items:center;padding:16px;text-align:center}

input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(55,230,255,.15)}
button{font:700 13px "Orbitron",sans-serif;letter-spacing:.24em;color:#03050B;background:linear-gradient(90deg,var(--cyan),var(--violet));border:0;border-radius:999px;padding:14px 30px;cursor:pointer;box-shadow:0 0 30px rgba(55,230,255,.45)}

.msg{min-height:22px;margin-top:14px;color:var(--muted);font:12px "JetBrains Mono",monospace}
.msg.err{color:#FF4D6A}
label.rec{display:block;margin-top:10px;color:var(--muted);font-size:13px}
html.auto form,html.auto label.rec{display:none}
html.auto .msg::before{content:"Cargando…"}

    let i=html.lastIndexOf('</body>');if(i<0)i=html.lastIndexOf('</BODY>');/* sin toLowerCase(): «İ» cambia la longitud y descuadra la posición */const tag='<script>'+ini+comp+'</'+'script>';
    html=i<0?html+tag:html.slice(0,i)+tag+html.slice(i);
    if(pw){try{sessionStorage.setItem('axis_e',JSON.stringify({c:pw}))}catch(e){}}}
  const rec=JSON.stringify({s:r.s,n:r.n,b:b64(raw),u:dentro.u||''});
  try{sessionStorage.setItem('cerebro_axis_cifrado','1');sessionStorage.setItem(SS,rec);if(guardar)localStorage.setItem(LS,rec);
    sessionStorage.removeItem('cerebro_axis_pw_s');localStorage.removeItem('cerebro_axis_pw')}catch(e){}
  document.open();document.write(html);document.close();
}
async function conContrasena(pw,guardar){
  const vistas={};
  for(const r of P.r){const raw=vistas[r.s+r.n]||(vistas[r.s+r.n]=await bits(pw,r.s,r.n));const d=await ranura(raw,r);
    if(d){try{await abre(d,r,raw,pw,guardar)}catch(e){console.error(e);return 'fallo'}return true}}
  return false}
async function conLlave(rec){for(const r of P.r){if(r.s!==rec.s||r.n!==rec.n)continue;const raw=u(rec.b);const d=await ranura(raw,r);if(d){await abre(d,r,raw,null,false);return true}}return false}
async function entrar(pw,guardar){
  const m=document.getElementById('m'),b=document.getElementById('b');
  b.disabled=true;m.className='msg';m.textContent='Descifrando…';
  let ok=false;try{ok=await conContrasena(pw,guardar)}catch(e){console.error(e);ok='fallo'}
  if(ok===true)return;
  m.className='msg err';b.disabled=false;
  /* un fallo al abrir no es una contraseña mala: se dice distinto */
  m.textContent=ok==='fallo'?'La contraseña es buena, pero la página no se ha podido abrir. Recarga; si sigue, avisa a Javi.':'Contraseña incorrecta';
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();entrar(document.getElementById('pw').value,document.getElementById('rec').checked);});
// Tras «load»: con la clave recordada no hay derivación lenta, y un document.open() con el analizador
// aún activo no hace nada (se quedaba en la pantalla de contraseña).
// Si no se puede abrir sola, el formulario vuelve con el motivo (nunca en silencio).
function formulario(motivo){document.documentElement.classList.remove('auto');const m=document.getElementById('m');
  if(motivo){m.className='msg err';m.textContent=motivo}const pw=document.getElementById('pw');if(pw)pw.focus()}
const arranque=async()=>{let rec=null;try{rec=JSON.parse(sessionStorage.getItem(SS)||localStorage.getItem(LS)||'null')}catch(e){}
  if(rec&&rec.b){try{if(await conLlave(rec))return}catch(e){console.error(e)}
    try{sessionStorage.removeItem(SS);localStorage.removeItem(LS)}catch(e){}
    formulario('La sesión ha caducado (el portal ha cambiado de contraseña o de versión): vuelve a entrar.');return}
  // acceso de antes (v1): la contraseña común guardada en claro. Se usa una vez y se cambia por la llave.
  let viejo=null;try{viejo=sessionStorage.getItem('cerebro_axis_pw_s')||localStorage.getItem('cerebro_axis_pw')}catch(e){}
  if(viejo){const recordar=(()=>{try{return !!localStorage.getItem('cerebro_axis_pw')}catch(e){return false}})();await entrar(viejo,recordar);
    if(document.getElementById('m'))formulario();return}
  formulario();
};
// Al «load» (con DOMContentLoaded, en Cerebro el document.open() se quedaba a medias y la página salía sin
// la mesa). Con la llave guardada no hay derivación lenta, y el formulario no se ve mientras tanto.
if(document.readyState==='complete')arranque();else addEventListener('load',arranque,{once:true});
</script>
