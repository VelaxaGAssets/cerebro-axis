<title>Baremo por confederación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{color-scheme:dark;--cyan:#37E6FF;--violet:#9B6BFF;--pink:#FF4FD8;--muted:#8796B3;--line:rgba(110,160,255,.25)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 600px at 50% 45%,rgba(40,70,200,.38),transparent 70%),linear-gradient(rgba(80,130,255,.05) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(80,130,255,.05) 1px,transparent 1px) 0 0/44px 44px,#03050B;color:#E9F1FF;font:15px/1.5 "Inter",system-ui,sans-serif;display:grid;place-items:center;padding:16px;text-align:center}
img{height:clamp(120px,22vh,210px);width:auto;margin-bottom:24px}
.eyebrow{font:700 11px "JetBrains Mono",monospace;letter-spacing:clamp(.12em,1vw,.42em);color:var(--cyan);text-transform:uppercase}
h1{margin:14px 0 26px;font:900 clamp(40px,9vw,96px)/.95 "Orbitron",sans-serif;letter-spacing:.12em;background:linear-gradient(100deg,#fff 10%,var(--cyan) 45%,var(--violet) 75%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
form{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
input{background:rgba(0,0,0,.4);border:1px solid var(--line);color:#fff;border-radius:999px;padding:13px 20px;font:15px "Inter",sans-serif;width:min(300px,100%)}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(55,230,255,.15)}
button{font:700 13px "Orbitron",sans-serif;letter-spacing:.24em;color:#03050B;background:linear-gradient(90deg,var(--cyan),var(--violet));border:0;border-radius:999px;padding:14px 30px;cursor:pointer;box-shadow:0 0 30px rgba(55,230,255,.45)}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:22px;margin-top:14px;color:var(--muted);font:12px "JetBrains Mono",monospace}
.msg.err{color:#FF4D6A}
label.rec{display:block;margin-top:10px;color:var(--muted);font-size:13px}
</style>
</head>

const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function abrir(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},k,u(P.c));
  return new TextDecoder().decode(t);
}
async function entrar(pw,guardar){
  const m=document.getElementById('m'),b=document.getElementById('b');
  b.disabled=true;m.className='msg';m.textContent='Descifrando…';
  try{
    const html=await abrir(pw);
    if(guardar){try{localStorage.setItem('cerebro_axis_pw',pw);}catch(e){}}
    try{sessionStorage.setItem('cerebro_axis_cifrado','1');sessionStorage.setItem('cerebro_axis_pw_s',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    try{localStorage.removeItem('cerebro_axis_pw');sessionStorage.removeItem('cerebro_axis_pw_s');}catch(_){}
    m.className='msg err';m.textContent='Contraseña incorrecta';b.disabled=false;
  }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();entrar(document.getElementById('pw').value,document.getElementById('rec').checked);});
let g=null;try{g=sessionStorage.getItem('cerebro_axis_pw_s')||localStorage.getItem('cerebro_axis_pw');}catch(e){}
